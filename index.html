<!DOCTYPE html>
<html lang="zh-Hant" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>手繪藝術 — 中國戲曲刮刀厚塗油畫訂製 | 影片診斷與展示</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Serif+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: { 950: '#0b0a09', 900: '#141210', 800: '#1f1c18' },
            vermilion: { 500: '#c83e2b', 600: '#a82e1e' },
            gold: { 300: '#e6c88c', 400: '#d4af37', 500: '#b89228' }
          },
          fontFamily: { serif: ['"Noto Serif TC"', 'serif'], sans: ['"Inter"', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0b0a09; color: #f3efe6; font-family: 'Inter', 'Noto Serif TC', sans-serif; overflow-x: hidden; }
    .font-oriental { font-family: 'Noto Serif TC', serif; }
    .canvas-texture { background-color: #161412; background-image: radial-gradient(rgba(212, 175, 55, 0.06) 1px, transparent 0); background-size: 24px 24px; }
    .gold-border { border: 1px solid rgba(212, 175, 55, 0.28); }
    .impasto-badge { background: linear-gradient(135deg, #c83e2b 0%, #872215 100%); }
  </style>
</head>
<body class="selection:bg-vermilion-500 selection:text-white">

  <!-- 頂部即時診斷狀態列 -->
  <div class="bg-ink-900 border-b border-gold-400/20 py-3 px-4 text-xs">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2 text-gold-300">
        <i class="fa-solid fa-stethoscope text-vermilion-500"></i>
        <span class="font-bold">GitHub Pages 影片即時診斷面板：</span>
      </div>
      <div id="diagnostics-bar" class="flex items-center gap-2 overflow-x-auto text-[11px] font-mono">
        <span class="px-2 py-0.5 rounded bg-stone-800 text-stone-400">正在檢測 assets/ 影片...</span>
      </div>
    </div>
  </div>

  <!-- 導覽列 -->
  <header class="sticky top-0 z-40 backdrop-blur-md bg-ink-950/85 border-b border-gold-400/20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="#" class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-lg impasto-badge flex items-center justify-center text-white font-oriental font-bold text-xl">戲</div>
        <div>
          <span class="font-oriental text-xl sm:text-2xl font-bold text-stone-100">手繪藝術 <span class="text-gold-400 font-normal text-base">| 中國戲曲</span></span>
          <span class="text-[11px] tracking-[0.2em] text-stone-400 uppercase">Palette Knife Oil Painting</span>
        </div>
      </a>
      <a href="#custom-order" class="px-4 py-2 rounded-lg bg-vermilion-500 text-white font-oriental text-sm font-semibold">立即訂製款</a>
    </div>
  </header>

  <!-- 主視覺播放器 -->
  <section class="relative canvas-texture py-12 sm:py-20 border-b border-gold-400/20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-center">
        <div class="lg:col-span-7 space-y-6">
          <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-ink-800 gold-border text-gold-300 text-xs uppercase">
            <span class="w-2 h-2 rounded-full bg-vermilion-500 animate-pulse"></span> 純手繪亞麻布刮刀油畫・接單訂製款
          </div>
          <h1 class="font-oriental text-4xl sm:text-5xl lg:text-6xl font-bold leading-tight text-stone-100">
            以刀代筆，<br /><span class="text-transparent bg-clip-text bg-gradient-to-r from-gold-300 to-vermilion-500">凝練東方戲曲之魂</span>
          </h1>
          <p class="text-stone-300 text-base leading-relaxed">
            融合西方油畫刮刀厚塗立體肌理與中國傳統戲曲寫意神韻，每一幅皆為獨一無二的手繪真跡。提供 20×30cm 與 30×40cm 典藏訂製。
          </p>
        </div>

        <div class="lg:col-span-5 flex flex-col items-center">
          <div class="w-full max-w-[360px] rounded-2xl bg-ink-900 p-3 gold-border shadow-2xl">
            <div class="flex items-center justify-between mb-2 px-1">
              <span id="hero-title-badge" class="text-xs font-oriental text-gold-300">實拍賞析 #01：青衣水袖</span>
            </div>
            <div class="relative aspect-[9/16] w-full rounded-xl overflow-hidden bg-ink-950 flex items-center justify-center">
              <video id="hero-video" class="w-full h-full object-cover" controls playsinline autoplay loop muted>
                <source id="hero-source" src="assets/815912786.371579.mp4" type="video/mp4">
              </video>
              <div id="hero-error-overlay" class="absolute inset-0 bg-ink-950/90 flex flex-col items-center justify-center p-4 text-center hidden">
                <i class="fa-solid fa-triangle-exclamation text-vermilion-500 text-3xl mb-2"></i>
                <p class="text-xs text-stone-300 font-mono" id="hero-error-text">影片載入失敗 (404 / LFS 指標檔)</p>
              </div>
            </div>
            <div class="grid grid-cols-8 gap-1 mt-3" id="hero-switcher-btns"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 8支實拍影片藝廊 -->
  <section id="gallery" class="py-16 bg-ink-950">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <h2 class="font-oriental text-3xl font-bold text-stone-100 mb-8">八大經典戲曲・實拍影片藝廊</h2>
      <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
    </div>
  </section>

  <!-- 線上訂製預約表單 -->
  <section id="custom-order" class="py-16 canvas-texture border-t border-gold-400/20">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="rounded-3xl bg-ink-900 p-6 sm:p-10 gold-border shadow-2xl">
        <h2 class="font-oriental text-3xl font-bold text-stone-100 mb-6 text-center">手繪戲曲油畫・專屬訂製預約單</h2>
        <form id="order-form" onsubmit="handleOrderSubmit(event)" class="space-y-4">
          <select id="order-style" class="w-full px-4 py-3 rounded-xl bg-ink-950 border border-stone-700 text-white text-sm">
            <option value="款式 #01：青衣水袖・藍袍旦角">款式 #01：青衣水袖・藍袍旦角</option>
            <option value="款式 #02：鳳冠點翠・花旦特寫">款式 #02：鳳冠點翠・花旦特寫</option>
            <option value="款式 #03：緋紅戎裝・刀馬旦">款式 #03：緋紅戎裝・刀馬旦</option>
            <option value="款式 #04：金縷流光・宮裝水袖">款式 #04：金縷流光・宮裝水袖</option>
            <option value="款式 #05：丹鳳青龍・關公武財神">款式 #05：丹鳳青龍・關公武財神</option>
            <option value="款式 #06：粉墨登場・黑臉淨角">款式 #06：粉墨登場・黑臉淨角</option>
            <option value="款式 #07：素雅水袖・荀派旦角">款式 #07：素雅水袖・荀派旦角</option>
            <option value="款式 #08：翠袍紗帽・文官老生">款式 #08：翠袍紗帽・文官老生</option>
          </select>
          <select id="order-size" class="w-full px-4 py-3 rounded-xl bg-ink-950 border border-stone-700 text-white text-sm">
            <option value="20 × 30 cm（精緻小品訂製款）">20 × 30 cm（精緻小品訂製款）</option>
            <option value="30 × 40 cm（經典畫幅訂製款）">30 × 40 cm（經典畫幅訂製款）</option>
          </select>
          <input id="order-contact" type="text" required placeholder="請輸入您的稱呼與聯絡方式" class="w-full px-4 py-3 rounded-xl bg-ink-950 border border-stone-700 text-white text-sm" />
          <button type="submit" class="w-full py-4 rounded-xl bg-vermilion-500 text-white font-oriental font-bold tracking-widest shadow-xl">生成專屬訂製單並複製</button>
        </form>
        <div id="order-result-box" class="hidden mt-4 p-4 rounded-xl bg-ink-950 border border-gold-400 text-xs text-stone-300 font-mono whitespace-pre-wrap"></div>
      </div>
    </div>
  </section>

  <script>
    // 使用您上傳成功的原始檔名清單
    const artworksData = [
      { id: 1, file: '815912786.371579.mp4', title: '青衣水袖・藍袍旦角' },
      { id: 2, file: '815912797.783649.mp4', title: '鳳冠點翠・花旦特寫' },
      { id: 3, file: '815912812.396800.mp4', title: '緋紅戎裝・刀馬旦' },
      { id: 4, file: '815912826.648221.mp4', title: '金縷流光・宮裝水袖' },
      { id: 5, file: '815912839.592319.mp4', title: '丹鳳青龍・關公武財神' },
      { id: 6, file: '815912859.228488.mp4', title: '粉墨登場・黑臉淨角' },
      { id: 7, file: '815912859.460000.mp4', title: '素雅水袖・荀派旦角' },
      { id: 8, file: '815912875.934846.mp4', title: '翠袍紗帽・文官老生' }
    ];

    // 即時檢測每個影片檔的連線與載入狀態
    async function runDiagnostics() {
      const bar = document.getElementById('diagnostics-bar');
      let html = '';
      
      for (let art of artworksData) {
        const url = `assets/${art.file}`;
        try {
          const res = await fetch(url, { method: 'HEAD' });
          if (res.ok) {
            html += `<span class="px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-500/40">#0${art.id}: 200 OK</span>`;
          } else {
            html += `<span class="px-2 py-0.5 rounded bg-vermilion-950 text-vermilion-300 border border-vermilion-500/40" title="檔案不存在或路徑錯誤">#0${art.id}: ${res.status}</span>`;
          }
        } catch (e) {
          html += `<span class="px-2 py-0.5 rounded bg-amber-950 text-amber-300 border border-amber-500/40">#0${art.id}: 載入異常</span>`;
        }
      }
      bar.innerHTML = html;
    }

    function initHero() {
      const container = document.getElementById('hero-switcher-btns');
      container.innerHTML = artworksData.map((art, idx) => `
        <button onclick="switchHero(${idx})" id="hero-btn-${idx}"
          class="py-1 rounded text-xs font-mono transition border ${idx === 0 ? 'bg-gold-400 text-ink-950 font-bold border-gold-400' : 'bg-ink-800 text-stone-300 border-stone-700'}">
          0${art.id}
        </button>
      `).join('');
      switchHero(0);
    }

    function switchHero(idx) {
      const art = artworksData[idx];
      document.getElementById('hero-title-badge').textContent = `實拍賞析 #0${art.id}：${art.title}`;
      artworksData.forEach((_, i) => {
        document.getElementById(`hero-btn-${i}`).className = i === idx ? 'py-1 rounded text-xs font-mono transition border bg-gold-400 text-ink-950 font-bold border-gold-400' : 'py-1 rounded text-xs font-mono transition border bg-ink-800 text-stone-300 border-stone-700';
      });

      const video = document.getElementById('hero-video');
      const source = document.getElementById('hero-source');
      const errorOverlay = document.getElementById('hero-error-overlay');
      
      source.src = `assets/${art.file}`;
      video.load();
      video.play().then(() => {
        errorOverlay.classList.add('hidden');
      }).catch(err => {
        errorOverlay.classList.remove('hidden');
        document.getElementById('hero-error-text').textContent = `無法播放: ${art.file} (可能為LFS指標檔)`;
      });
    }

    function renderGallery() {
      const grid = document.getElementById('gallery-grid');
      grid.innerHTML = artworksData.map(art => `
        <article class="rounded-2xl bg-ink-900 gold-border overflow-hidden flex flex-col justify-between">
          <div class="relative aspect-[9/16] w-full bg-ink-950 flex items-center justify-center">
            <video class="w-full h-full object-cover" controls playsinline loop muted preload="metadata">
              <source src="assets/${art.file}" type="video/mp4">
            </video>
            <div class="absolute top-3 left-3 px-2 py-1 rounded bg-black/75 text-gold-300 font-mono text-xs pointer-events-none">#0${art.id}</div>
          </div>
          <div class="p-4">
            <h3 class="font-oriental text-lg font-bold text-stone-100">${art.title}</h3>
          </div>
        </article>
      `).join('');
    }

    function handleOrderSubmit(e) {
      e.preventDefault();
      const summary = `【手繪戲曲油畫訂製單】\n款式：${document.getElementById('order-style').value}\n尺寸：${document.getElementById('order-size').value}\n聯絡：${document.getElementById('order-contact').value}`;
      const box = document.getElementById('order-result-box');
      box.textContent = summary;
      box.classList.remove('hidden');
    }

    window.addEventListener('DOMContentLoaded', () => {
      runDiagnostics();
      initHero();
      renderGallery();
    });
  </script>
</body>
</html>
