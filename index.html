<!DOCTYPE html>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: {
              950: '#0b0a09',
              900: '#141210',
              800: '#1f1c18',
              700: '#2e2923',

              700: '#872215',
            },
            gold: {

              400: '#d4af37',
              500: '#b89228',
            },
            peacock: {
              500: '#1b6d7a',

            }
          },
          fontFamily: {
            serif: ['"Noto Serif TC"', 'serif'],
            sans: ['"Inter"', '"Noto Serif TC"', 'sans-serif'],
          }
        }
      }
    }

  <style>
    body {
      background-color: #0b0a09;
      color: #f3efe6;
      font-family: 'Inter', 'Noto Serif TC', sans-serif;
      overflow-x: hidden;
    }
    .font-oriental {
      font-family: 'Noto Serif TC', serif;
    }
    .canvas-texture {
      background-color: #161412;
      background-image: 
        radial-gradient(rgba(212, 175, 55, 0.06) 1px, transparent 0),
        radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }
    .gold-border {
      border: 1px solid rgba(212, 175, 55, 0.28);
    }
    .gold-border-hover:hover {
      border-color: rgba(212, 175, 55, 0.75);
      box-shadow: 0 10px 30px -10px rgba(212, 175, 55, 0.2);
    }
    .impasto-badge {
      background: linear-gradient(135deg, #c83e2b 0%, #872215 100%);
      box-shadow: 2px 3px 0px rgba(212, 175, 55, 0.4);
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #141210;
    }
    ::-webkit-scrollbar-thumb {
      background: #3d352e;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #d4af37;
    }
    .frame-walnut {
      border: 14px solid #3c2415;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.85), 0 20px 40px rgba(0,0,0,0.75);
      outline: 2px solid #593822;
    }
    .frame-black {
      border: 14px solid #181818;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.9), 0 20px 40px rgba(0,0,0,0.8);
      outline: 1px solid #333;
    }
    .frame-canvas {
      border: none;
      box-shadow: 6px 6px 0px #2a2520, 0 20px 35px rgba(0,0,0,0.75);
    }
  </style>
</head>
